<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>几何变形魔法 · 杜德尼挑战</title>
  <link rel="stylesheet" href="./styles/app.css">
</head>
<body>
  <header class="top-bar">
    <div class="title-area">
      <h1>几何变形魔法</h1>
      <p id="appSubtitle">杜德尼三角形 → 正方形铰链剖分</p>
    </div>
    <label class="case-picker"><span>案例</span><select id="caseSelect" aria-label="选择铰链剖分案例"></select></label>
    <nav class="stage-area" aria-label="教学阶段">
      <div class="stage active" id="stage1">① 找割线</div><div class="stage" id="stage2">② 找铰链</div><div class="stage" id="stage3">③ 变形</div>
    </nav>
  </header>
  <main class="main">
    <section class="board" id="board">
      <div class="board-tip" id="boardTip"></div>
      <svg id="geometry" viewBox="0 0 1000 650" preserveAspectRatio="xMidYMid meet" aria-label="铰链剖分几何图">
        <g data-layer="source"></g><g data-layer="pieces"></g><g data-layer="cuts"></g><g data-layer="outline"></g>
        <g data-layer="hingeCandidates"></g><g data-layer="hinges"></g><g data-layer="labels"></g>
      </svg>
    </section>
    <aside class="control-panel">
      <div class="card">
        <section class="phase-panel active" id="phase1">
          <div class="question-number" id="phase1Number"></div><h2 id="phase1Title"></h2>
          <div class="transform-preview" aria-hidden="true"><div class="mini-triangle"></div><div class="arrow">→</div><div class="mini-square"></div></div>
          <div class="description" id="phase1Description"></div>
          <div class="selection-count"><span id="cutCountLabel"></span><span><span class="selection-number" id="lineCount">0</span> / <span id="cutCountTarget">3</span></span></div><br>
          <button class="main-button" id="checkLinesButton" disabled></button>
          <div class="button-row"><button class="secondary-button" id="lineHintButton">给我提示</button><button class="secondary-button reset-button">重新开始</button></div>
        </section>
        <section class="phase-panel" id="phase2">
          <div class="question-number" id="phase2Number"></div><h2 id="phase2Title"></h2><div class="description" id="phase2Description"></div>
          <div class="selection-count"><span id="hingeCountLabel"></span><span><span class="selection-number" id="hingeCount">0</span> / <span id="hingeCountTarget">3</span></span></div><br>
          <button class="main-button" id="checkHingesButton" disabled></button>
          <div class="button-row"><button class="secondary-button" id="hingeHintButton">给我提示</button><button class="secondary-button reset-button">重新开始</button></div>
        </section>
        <section class="phase-panel" id="phase3">
          <div class="question-number" id="phase3Number"></div><h2 id="phase3Title"></h2><div class="description" id="phase3Description"></div>
          <div class="motion-info" id="motionInfo"></div><button class="main-button" id="transformButton">▶ 开始变形</button>
          <div class="final-message" id="finalMessage"></div>
          <div class="button-row"><button class="secondary-button" id="replayButton">再看一次</button><button class="secondary-button reset-button">重新挑战</button></div>
        </section>
      </div>
      <div class="card"><div class="message" id="message"></div></div>
    </aside>
  </main>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
